[package]
name = "apple-store-inventory-monitor"
description = "Apple 直营店到店取货库存监控"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# _lib 后缀不是多余的：Windows 上库名与二进制同名会冲突。
# 见 https://github.com/rust-lang/cargo/issues/8519
name = "apple_store_inventory_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
apw-core = { path = "../crates/apw-core" }
# tray-icon：系统托盘。这类工具会被长时间挂着盯库存，
# 能收进托盘后台跑，比占着一个 Dock 图标和窗口合理得多。
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-util = "0.3"
tempfile = "3"
tokio.workspace = true
tokio-tungstenite = "0.28"
